name: CI

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      full:
        description: Also run the release-only checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # CONTRIBUTING.md says a pull request whose commits are not signed off
      # cannot be merged. This is what makes that sentence true.
      - name: Commits carry a Developer Certificate of Origin sign-off
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --quiet origin "$BASE_SHA" "$HEAD_SHA"
          bash scripts/check-signoff.sh "$BASE_SHA" "$HEAD_SHA"

      # Provenance gate, part 1: the vendored OpenAPI contract must match the
      # SHA-256 recorded in MANIFEST.json, so a hand-edit to the vendored spec
      # cannot slip through without a deliberate manifest update.
      - name: Verify spec hash
        run: |
          EXPECTED=$(python3 -c "import json; print(json.load(open('vendor/spec/MANIFEST.json'))['openapiSha256'])")
          ACTUAL=$(sha256sum vendor/spec/openapi.yaml | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: vendor/spec/openapi.yaml SHA mismatch"
            echo "  MANIFEST: $EXPECTED"
            echo "  actual:   $ACTUAL"
            exit 1
          fi

      - name: Set up Node.js 22
        uses: ezclassify/.github/actions/setup-node-npm@da1e243029be7e724f808cca11e385e6d79eee8b # v7.0.0
        with:
          node-version: "22"

      # The notices and dependency-age gates refuse things, so their own tests
      # run here too. They need Node only, so they run before the JDK.
      - name: Repository policy scripts behave as specified
        run: node --test scripts/gen-notices.test.mjs scripts/check-signoff.test.mjs scripts/check-dependency-age.test.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # Quarantine gate: no third-party artifact this build uses may be newer than
      # seven days. It runs before the build. One Maven run only resolves and
      # lists the closure: every scope of every reactor module, every build
      # plugin and each plugin's own dependencies. Maven itself and the two
      # listing plugins pinned here are the only third-party code that runs
      # first. The generator toolchain is read from its lockfile before the
      # build's `npm ci` installs it.
      - name: Third-party dependencies clear the seven-day quarantine
        run: |
          ./mvnw org.codehaus.mojo:license-maven-plugin:2.7.1:aggregate-add-third-party \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:resolve-plugins \
            '-Dlicense.outputDirectory=${maven.multiModuleProjectDirectory}/target/dependency-age' \
            -Dlicense.thirdPartyFilename=dependencies.txt \
            '-DoutputFile=${maven.multiModuleProjectDirectory}/target/dependency-age/plugins.txt' \
            -DappendOutput=true --batch-mode --no-transfer-progress -q
          node scripts/check-dependency-age.mjs

      # License gate over the production (compile + runtime) closure of every
      # reactor module: each dependency must carry an allowlisted license, the
      # generated section of THIRD-PARTY-NOTICES.md must match the current
      # closure, and the curated sections must name that same set of components.
      # It needs dependency resolution only, so it runs before the build.
      - name: Dependency license compliance and third-party notices
        run: |
          ./mvnw org.codehaus.mojo:license-maven-plugin:2.7.1:aggregate-add-third-party \
            -Dlicense.excludedScopes=test,provided --batch-mode --no-transfer-progress -q
          node scripts/gen-notices.mjs --check

      - name: Build and test (Maven multi-module)
        run: ./mvnw verify --batch-mode --no-transfer-progress

      # The Maven build regenerates the wire records from vendor/spec on every
      # compile. The generator must write only under its output directory; a
      # modified tracked file means it (or a template it reads) regressed.
      - name: Generator leaves the tracked tree untouched
        run: git diff --exit-code

      - name: Generated and handwritten type ownership is singular
        run: node scripts/check-architecture.mjs

      # 1.0 public-surface freeze: diffs the javap dump of the compiled client
      # module against the committed golden api-surface.txt. Reviewed API
      # changes regenerate the golden with 'make api-surface'.
      - name: Public API surface is frozen at 1.0
        run: make check-api-surface

      - name: Working tree is clean after build
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  # Release-only. The release train accepts a workflow_dispatch run of this
  # workflow with full=true when every job, this one included, succeeds.
  full:
    name: full
    needs: ci
    if: ${{ inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: ezclassify/.github/actions/setup-node-npm@da1e243029be7e724f808cca11e385e6d79eee8b # v7.0.0
        with:
          node-version: "22"

      # Provenance gate, part 2: nothing generated is committed, so the property
      # that matters is determinism. Two runs of the generator over the
      # hash-verified schemas must produce identical output, or the build and
      # the api-surface golden would not be reproducible.
      - name: Generator output is deterministic
        run: |
          npm --prefix tools ci --no-audit --no-fund
          node client/scripts/gen.mjs vendor/spec/json-schemas client/target/regen-check/a com.ezclassify.rest.contract vendor/spec/openapi.yaml
          node client/scripts/gen.mjs vendor/spec/json-schemas client/target/regen-check/b com.ezclassify.rest.contract vendor/spec/openapi.yaml
          diff -r client/target/regen-check/a client/target/regen-check/b

      - name: Working tree is clean
        run: test -z "$(git status --porcelain)"
