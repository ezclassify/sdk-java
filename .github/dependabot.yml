# Routine updates preserve the supported compatibility lines.
# Major upgrades are deliberate; security updates retain their separate policy.

version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: cron
      cronjob: '17 3 * * *'
      timezone: America/New_York
    cooldown:
      # Matches the seven-day window `scripts/check-dependency-age.mjs` enforces,
      # so Dependabot does not open a bump the gate would refuse.
      default-days: 7
    groups:
      maven-production:
        dependency-type: production
        update-types: [minor, patch]
      maven-development:
        dependency-type: development
        update-types: [minor, patch]
    labels: [dependencies]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: cron
      cronjob: '17 3 * * *'
      timezone: America/New_York
    cooldown:
      # Matches the seven-day window `scripts/check-dependency-age.mjs` enforces,
      # so Dependabot does not open a bump the gate would refuse.
      default-days: 7
    groups:
      npm-tools:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 1
    versioning-strategy: increase-if-necessary

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '17 3 * * *'
      timezone: America/New_York
    cooldown:
      # Matches the seven-day window `scripts/check-dependency-age.mjs` enforces,
      # so Dependabot does not open a bump the gate would refuse.
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 1
